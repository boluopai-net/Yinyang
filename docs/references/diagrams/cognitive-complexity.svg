<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 800" aria-labelledby="title desc"><title id="title">Three principles for building a personal environment</title><desc id="desc">The principles address building an environment, explaining a concept, and helping someone configure their own environment.</desc><rect width="1200" height="800" rx="12" fill="#f9f8f4"/><g font-family="PingFang SC,Helvetica Neue,Arial,sans-serif">
<text x="54" y="91" font-size="41" font-weight="600" fill="#2b443b">Three principles for building a personal environment</text>
<rect x="46" y="138" width="1108" height="185" rx="14" fill="#ebf0eb" stroke="#cbd6ce"/>
<text x="77" y="180" font-size="19" font-weight="400" fill="#526b5f">Building the environment</text>
<text x="76" y="238" font-size="32" font-weight="600" fill="#2b443b">Intuition over formalism</text>
<path d="M456 166v129" stroke="#c0cec4" stroke-width="2"/>
<text x="484" y="183" font-size="19" font-weight="400" fill="#2b443b">Make the purpose and use of the environment apparent through</text>
<text x="484" y="208" font-size="19" font-weight="400" fill="#2b443b">everyday experience.</text>
<text x="484" y="251" font-size="19" font-weight="400" fill="#2b443b">Introduce formal language when a precise definition,</text>
<text x="484" y="276" font-size="19" font-weight="400" fill="#2b443b">calculation, or proof calls for it.</text>
<rect x="46" y="351" width="1108" height="185" rx="14" fill="#eff1ec" stroke="#cbd6ce"/>
<text x="77" y="393" font-size="19" font-weight="400" fill="#526b5f">Introducing a concept</text>
<text x="76" y="451" font-size="32" font-weight="600" fill="#2b443b">Clarity over complexity</text>
<path d="M456 379v129" stroke="#c0cec4" stroke-width="2"/>
<text x="484" y="396" font-size="19" font-weight="400" fill="#2b443b">Say directly what the concept means in everyday language.</text>
<text x="484" y="464" font-size="19" font-weight="400" fill="#2b443b">Keep distinctions that matter to its meaning. Omit repetition</text>
<text x="484" y="489" font-size="19" font-weight="400" fill="#2b443b">and incidental caveats.</text>
<rect x="46" y="564" width="1108" height="185" rx="14" fill="#e8efeb" stroke="#cbd6ce"/>
<text x="77" y="606" font-size="19" font-weight="400" fill="#526b5f">Helping with personal configuration</text>
<text x="76" y="664" font-size="32" font-weight="600" fill="#2b443b">Visuals over text</text>
<path d="M456 592v129" stroke="#c0cec4" stroke-width="2"/>
<text x="484" y="609" font-size="19" font-weight="400" fill="#2b443b">Show layouts, relationships, and changes so the person can see</text>
<text x="484" y="634" font-size="19" font-weight="400" fill="#2b443b">them directly.</text>
<text x="484" y="677" font-size="19" font-weight="400" fill="#2b443b">Use words for the names and conditions needed to judge the</text>
<text x="484" y="702" font-size="19" font-weight="400" fill="#2b443b">configuration.</text></g></svg>
