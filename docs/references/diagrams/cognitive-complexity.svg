<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 410"><title id="title">Three principles for presenting information</title><desc id="desc">Visuals over text, clarity over complexity, intuition over formalism.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#58736a" stroke-width="1.3"/></marker></defs><rect width="1200" height="410" rx="12" fill="#f9f8f4"/><g font-family="PingFang SC,Helvetica Neue,Arial,sans-serif"><text x="48" y="73" font-size="40" font-weight="600" fill="#263e39" text-anchor="start">Three principles for presenting information</text><text x="50" y="120" font-size="23" font-weight="400" fill="#4e625e" text-anchor="start">Leave readers free to focus on what they want to understand and judge.</text><rect x="42" y="164" width="362" height="202" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="64" y="218" font-size="28" font-weight="600" fill="#263e39" text-anchor="start">Visuals over text</text><text x="64" y="258" font-size="22" font-weight="400" fill="#4e625e" text-anchor="start">Show the relationship</text><rect x="418" y="164" width="362" height="202" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="440" y="218" font-size="28" font-weight="600" fill="#263e39" text-anchor="start">Clarity over complexity</text><text x="440" y="258" font-size="22" font-weight="400" fill="#4e625e" text-anchor="start">Use everyday language</text><rect x="794" y="164" width="362" height="202" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="816" y="218" font-size="28" font-weight="600" fill="#263e39" text-anchor="start">Intuition over formalism</text><text x="816" y="258" font-size="22" font-weight="400" fill="#4e625e" text-anchor="start">Start with a familiar situation</text><text x="68" y="325" font-size="22" font-weight="400" fill="#263e39" text-anchor="start">Notice</text><path d="M166 318h29" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><text x="210" y="325" font-size="22" font-weight="400" fill="#263e39" text-anchor="start">Revise</text><path d="M267 318h25" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><text x="305" y="325" font-size="22" font-weight="400" fill="#263e39" text-anchor="start">Try again</text><text x="440" y="308" font-size="21" font-weight="400" fill="#263e39" text-anchor="start">“Recover the context”</text><text x="440" y="341" font-size="22" font-weight="600" fill="#263e39" text-anchor="start">→ Pick up the thought</text><text x="816" y="308" font-size="20" font-weight="400" fill="#263e39" text-anchor="start">Back on the same line,</text><text x="816" y="341" font-size="18" font-weight="400" fill="#263e39" text-anchor="start">you lose the link between paragraphs.</text></g></svg>
