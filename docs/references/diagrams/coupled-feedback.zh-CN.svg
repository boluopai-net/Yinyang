<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 668"><title id="title">为人与 AI 的耦合系统做负反馈</title><desc id="desc">每次协作中，人与 AI 依据实际结果纠偏。经过多轮，再看这些纠正累积起来对人的发展有何影响，据此调整反馈本身。</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#58736a" stroke-width="1.3"/></marker></defs><rect width="1200" height="668" rx="12" fill="#f9f8f4"/><g font-family="PingFang SC,Helvetica Neue,Arial,sans-serif"><text x="48" y="71" font-size="39" font-weight="600" fill="#263e39" text-anchor="start">为人与 AI 的耦合系统做负反馈</text><text x="50" y="118" font-size="23" font-weight="400" fill="#4e625e" text-anchor="start">反向对齐给出方向：这段协作想让人发展什么能力？</text><text x="51" y="192" font-size="27" font-weight="600" fill="#263e39" text-anchor="start">每一轮，依据实际结果纠偏</text><rect x="52" y="218" width="314" height="105" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="209" y="262" font-size="26" font-weight="600" fill="#263e39" text-anchor="middle">第一次协作</text><text x="209" y="298" font-size="20" font-weight="400" fill="#4e625e" text-anchor="middle">尝试 → 看到偏差 → 调整</text><path d="M374 270h46" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><rect x="435" y="218" width="314" height="105" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="592" y="262" font-size="26" font-weight="600" fill="#263e39" text-anchor="middle">下一次协作</text><text x="592" y="298" font-size="20" font-weight="400" fill="#4e625e" text-anchor="middle">尝试 → 看到偏差 → 调整</text><path d="M757 270h46" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><rect x="818" y="218" width="314" height="105" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="975" y="262" font-size="26" font-weight="600" fill="#263e39" text-anchor="middle">更多次协作</text><text x="975" y="298" font-size="20" font-weight="400" fill="#4e625e" text-anchor="middle">尝试 → 看到偏差 → 调整</text><path d="M977 324v47" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><rect x="52" y="384" width="1080" height="105" rx="12" fill="#e6ece7" stroke="#c6d1c9"/><text x="81" y="427" font-size="29" font-weight="600" fill="#263e39" text-anchor="start">过一段时间，看这些纠正积累起来带来了什么</text><text x="81" y="465" font-size="22" font-weight="400" fill="#4e625e" text-anchor="start">共同完成的事有哪些变化？本人后来能察觉、理解、判断或发起什么？</text><path d="M591 490v37" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><rect x="52" y="538" width="1080" height="100" rx="12" fill="#dfe8e2" stroke="#c6d1c9"/><text x="81" y="579" font-size="29" font-weight="600" fill="#263e39" text-anchor="start">据此调整负反馈本身</text><text x="81" y="616" font-size="22" font-weight="400" fill="#4e625e" text-anchor="start">哪些偏差值得纠正？让什么信号在何时返回？怎样回应，才有助于想培养的能力？</text><path d="M52 589H32 Q19 589 19 576V280 Q19 270 30 270H48" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/></g></svg>
