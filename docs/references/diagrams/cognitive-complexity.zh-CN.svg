<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 800" aria-labelledby="title desc"><title id="title">处理文字的三条原则</title><desc id="desc">两条线从重合到分开。直接看形状辨认变化，用日常语言说明差距，只有求具体数值时才引入计算。</desc><rect width="1200" height="800" fill="#f9f8f4" rx="12"/><g font-family="PingFang SC,Helvetica Neue,Arial,sans-serif">
<text x="52" y="75" font-size="42" font-weight="600" fill="#233e38">处理文字的三条原则</text>
<text x="54" y="122" font-size="28" font-weight="400" fill="#233e38">两条曲线从哪里开始分开？</text>
<rect x="44" y="159" width="1112" height="315" rx="14" fill="#eaf0eb"/>
<text x="71" y="215" font-size="30" font-weight="600" fill="#233e38">图优于文字</text>
<text x="73" y="267" font-size="22" font-weight="400" fill="#233e38">看形状，就能找到分开的位置，</text>
<text x="73" y="303" font-size="22" font-weight="400" fill="#233e38">也能看出之后的走势。</text>
<path d="M497 203V416H1107" fill="none" stroke="#9cac9f" stroke-width="2" />
<text x="1060" y="450" font-size="18" font-weight="400" fill="#4e655c">时间</text>
<path d="M521 365 C594 365 627 335 706 335 S779 332 809 323" fill="none" stroke="#455f54" stroke-width="5" />
<path d="M809 323 C889 323 967 249 1064 212" fill="none" stroke="#354f46" stroke-width="5" />
<path d="M809 323 C893 323 970 361 1064 364" fill="none" stroke="#698278" stroke-width="5" stroke-dasharray="12 7"/>
<circle cx="809" cy="323" r="7" fill="#344f46"/>
<path d="M809 338v38" fill="none" stroke="#597068" stroke-width="2" />
<text x="770" y="402" font-size="19" font-weight="600" fill="#233e38">从这里分开</text>
<path d="M1075 213h12v150h-12" fill="none" stroke="#596e66" stroke-width="2.5" />
<text x="1095" y="294" font-size="19" font-weight="600" fill="#233e38">差距</text>
<rect x="44" y="498" width="541" height="255" rx="14" fill="#f0f2ee"/>
<rect x="602" y="498" width="554" height="255" rx="14" fill="#f0f2ee"/>
<text x="72" y="553" font-size="30" font-weight="600" fill="#233e38">清晰优于复杂</text>
<text x="72" y="603" font-size="23" font-weight="400" fill="#4e655c">图里的「差距」是什么意思？</text>
<text x="72" y="654" font-size="24" font-weight="400" fill="#233e38">在同一时刻，一条线比另一条线</text>
<text x="72" y="688" font-size="24" font-weight="400" fill="#233e38">高出多少，就是它们的差距。</text>
<text x="630" y="553" font-size="30" font-weight="600" fill="#233e38">直观优于形式</text>
<text x="630" y="600" font-size="23" font-weight="400" fill="#233e38">想知道变化方向，看图就能说：</text>
<text x="630" y="634" font-size="23" font-weight="400" fill="#233e38">两条线分开后，差距越来越大。</text>
<path d="M630 659H1124" fill="none" stroke="#c0ccc3" stroke-width="1" />
<text x="630" y="693" font-size="21" font-weight="400" fill="#4e655c">要算差多少时，再取同一时刻的两个值，</text>
<text x="630" y="724" font-size="21" font-weight="400" fill="#4e655c">用较大的减去较小的。</text></g></svg>
