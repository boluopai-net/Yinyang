<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 410"><title id="title">处理文字的三条原则</title><desc id="desc">图优于文字，清晰优于复杂，直观优于形式。</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#58736a" stroke-width="1.3"/></marker></defs><rect width="1200" height="410" rx="12" fill="#f9f8f4"/><g font-family="PingFang SC,Helvetica Neue,Arial,sans-serif"><text x="48" y="73" font-size="40" font-weight="600" fill="#263e39" text-anchor="start">处理文字的三条原则</text><text x="50" y="120" font-size="23" font-weight="400" fill="#4e625e" text-anchor="start">让读者把注意力留给自己要理解和判断的事。</text><rect x="42" y="164" width="362" height="202" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="64" y="218" font-size="28" font-weight="600" fill="#263e39" text-anchor="start">图优于文字</text><text x="64" y="258" font-size="22" font-weight="400" fill="#4e625e" text-anchor="start">让关系直接可见</text><rect x="418" y="164" width="362" height="202" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="440" y="218" font-size="28" font-weight="600" fill="#263e39" text-anchor="start">清晰优于复杂</text><text x="440" y="258" font-size="22" font-weight="400" fill="#4e625e" text-anchor="start">用日常语言说清概念</text><rect x="794" y="164" width="362" height="202" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="816" y="218" font-size="28" font-weight="600" fill="#263e39" text-anchor="start">直观优于形式</text><text x="816" y="258" font-size="22" font-weight="400" fill="#4e625e" text-anchor="start">从读者能认出的情景讲起</text><text x="68" y="325" font-size="22" font-weight="400" fill="#263e39" text-anchor="start">发现差异</text><path d="M166 318h29" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><text x="210" y="325" font-size="22" font-weight="400" fill="#263e39" text-anchor="start">修改</text><path d="M267 318h25" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><text x="305" y="325" font-size="22" font-weight="400" fill="#263e39" text-anchor="start">再试</text><text x="440" y="308" font-size="21" font-weight="400" fill="#263e39" text-anchor="start">「恢复上下文」</text><text x="440" y="341" font-size="22" font-weight="600" fill="#263e39" text-anchor="start">→ 接上刚才的思路</text><text x="816" y="308" font-size="20" font-weight="400" fill="#263e39" text-anchor="start">翻完脚注，回到原行，</text><text x="816" y="341" font-size="22" font-weight="400" fill="#263e39" text-anchor="start">却忘了两段怎样相连。</text></g></svg>
