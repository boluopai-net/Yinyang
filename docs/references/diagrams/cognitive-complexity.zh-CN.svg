<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 800" aria-labelledby="title desc"><title id="title">模型构筑个人环境的三个原则</title><desc id="desc">三项原则分别说明模型如何构筑环境、介绍概念和帮助本人配置环境。</desc><rect width="1200" height="800" rx="12" fill="#f9f8f4"/><g font-family="PingFang SC,Helvetica Neue,Arial,sans-serif">
<text x="54" y="91" font-size="43" font-weight="600" fill="#2b443b">模型构筑个人环境的三个原则</text>
<rect x="46" y="138" width="1108" height="185" rx="14" fill="#ebf0eb" stroke="#cbd6ce"/>
<text x="77" y="180" font-size="22" font-weight="400" fill="#526b5f">构筑环境</text>
<text x="76" y="238" font-size="35" font-weight="600" fill="#2b443b">直观优于形式</text>
<path d="M456 166v129" stroke="#c0cec4" stroke-width="2"/>
<text x="484" y="210" font-size="22" font-weight="400" fill="#2b443b">让本人凭日常经验就能看懂环境怎样使用、能用来做什么。</text>
<text x="484" y="263" font-size="22" font-weight="400" fill="#2b443b">需要精确定义、计算或证明时，再引入相应的形式语言。</text>
<rect x="46" y="351" width="1108" height="185" rx="14" fill="#eff1ec" stroke="#cbd6ce"/>
<text x="77" y="393" font-size="22" font-weight="400" fill="#526b5f">介绍概念</text>
<text x="76" y="451" font-size="35" font-weight="600" fill="#2b443b">清晰优于复杂</text>
<path d="M456 379v129" stroke="#c0cec4" stroke-width="2"/>
<text x="484" y="423" font-size="22" font-weight="400" fill="#2b443b">用日常语言直接说清一个概念指什么。</text>
<text x="484" y="476" font-size="22" font-weight="400" fill="#2b443b">保留决定含义的区别和条件，省去重复解释和琐碎限定。</text>
<rect x="46" y="564" width="1108" height="185" rx="14" fill="#e8efeb" stroke="#cbd6ce"/>
<text x="77" y="606" font-size="22" font-weight="400" fill="#526b5f">帮助本人配置环境</text>
<text x="76" y="664" font-size="35" font-weight="600" fill="#2b443b">图优于文字</text>
<path d="M456 592v129" stroke="#c0cec4" stroke-width="2"/>
<text x="484" y="636" font-size="22" font-weight="400" fill="#2b443b">把布局、关系和变化画出来，让本人直接看见。</text>
<text x="484" y="689" font-size="22" font-weight="400" fill="#2b443b">文字标明必要的名称和条件，本人就能对着配置作判断。</text></g></svg>
