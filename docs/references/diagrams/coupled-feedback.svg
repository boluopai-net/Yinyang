<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 668"><title id="title">Designing negative feedback for human–AI collaboration</title><desc id="desc">People and AI correct course during collaboration. Across rounds, examine the cumulative effects on human development and revise the feedback itself.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#58736a" stroke-width="1.3"/></marker></defs><rect width="1200" height="668" rx="12" fill="#f9f8f4"/><g font-family="PingFang SC,Helvetica Neue,Arial,sans-serif"><text x="48" y="71" font-size="36" font-weight="600" fill="#263e39" text-anchor="start">Designing negative feedback for human–AI collaboration</text><text x="50" y="118" font-size="23" font-weight="400" fill="#4e625e" text-anchor="start">Human development sets the direction. What capacity should this collaboration cultivate?</text><text x="51" y="192" font-size="27" font-weight="600" fill="#263e39" text-anchor="start">Within each round, use the outcome to correct course</text><rect x="52" y="218" width="314" height="105" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="209" y="262" font-size="26" font-weight="600" fill="#263e39" text-anchor="middle">First round</text><text x="209" y="298" font-size="20" font-weight="400" fill="#4e625e" text-anchor="middle">Try → notice a gap → adjust</text><path d="M374 270h46" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><rect x="435" y="218" width="314" height="105" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="592" y="262" font-size="26" font-weight="600" fill="#263e39" text-anchor="middle">Next round</text><text x="592" y="298" font-size="20" font-weight="400" fill="#4e625e" text-anchor="middle">Try → notice a gap → adjust</text><path d="M757 270h46" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><rect x="818" y="218" width="314" height="105" rx="12" fill="#f2f4f0" stroke="#c6d1c9"/><text x="975" y="262" font-size="26" font-weight="600" fill="#263e39" text-anchor="middle">Later rounds</text><text x="975" y="298" font-size="20" font-weight="400" fill="#4e625e" text-anchor="middle">Try → notice a gap → adjust</text><path d="M977 324v47" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><rect x="52" y="384" width="1080" height="105" rx="12" fill="#e6ece7" stroke="#c6d1c9"/><text x="81" y="427" font-size="29" font-weight="600" fill="#263e39" text-anchor="start">Over time, examine what the corrections add up to</text><text x="81" y="465" font-size="20" font-weight="400" fill="#4e625e" text-anchor="start">What can the two now accomplish? What can the person now notice, understand, judge or initiate?</text><path d="M591 490v37" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/><rect x="52" y="538" width="1080" height="100" rx="12" fill="#dfe8e2" stroke="#c6d1c9"/><text x="81" y="579" font-size="29" font-weight="600" fill="#263e39" text-anchor="start">Use the cumulative effects to redesign the feedback</text><text x="81" y="616" font-size="22" font-weight="400" fill="#4e625e" text-anchor="start">Which gaps matter? What signal should return, when, and how should the two respond?</text><path d="M52 589H32 Q19 589 19 576V280 Q19 270 30 270H48" fill="none" stroke="#58736a" stroke-width="3" marker-end="url(#tip)"/></g></svg>
