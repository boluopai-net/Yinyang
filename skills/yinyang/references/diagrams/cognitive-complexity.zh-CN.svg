<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 820">
<title id="title">把环境的认知要求控制在可接受范围内</title><desc id="desc">界面、资料、工作流程与模型辅助共同形成环境的认知要求。这里采用的分工是本人通过感知、短解释、判断和纠正培养具身推理、直觉与自然语言推理，模型承担完整语言展开、形式推理、检索整理、实现、接续与核验。结果返回本人使用和判断。分别检查成果、总负担与能力发展，将要求控制在本人可接受范围内，再用所得改善环境与形成它的方法。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.title{font-size:36px;font-weight:600;fill:#223c3b}.sub{font-size:22px;fill:#576d67}.label{font-size:20px;font-weight:600;fill:#355a50}.body{font-size:23px;fill:#405653}.focus{font-size:27px;font-weight:600;fill:#804327}.rule{font-size:20px;font-weight:700;fill:#804327}.result{font-size:28px;font-weight:600;fill:#223c3b}.return{font-size:23px;font-weight:600;fill:#804327}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a15035" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="820" rx="10" fill="#faf9f4"/>
<rect x="34" y="148" width="1132" height="430" rx="20" fill="#f0f3ef" stroke="#c7d5cc"/>
<text x="52" y="73" class="title">把环境的认知要求控制在可接受范围内</text><text x="54" y="114" class="sub">界面、资料、工作流程与模型辅助，共同决定本人需要处理什么</text><rect x="54" y="170" width="352" height="132" rx="14" fill="#ffffff"/><text x="76" y="207" class="label">选定培养目标</text><text x="76" y="245" class="body">具身推理与直觉</text><text x="76" y="277" class="body">自然语言中的生成与判断</text><rect x="424" y="170" width="352" height="132" rx="14" fill="#ffffff"/><text x="446" y="207" class="label">本人保留的练习</text><text x="446" y="245" class="body">察觉、解释、比较与判断</text><text x="446" y="277" class="body">带着反馈再次尝试</text><rect x="794" y="170" width="352" height="132" rx="14" fill="#f5e7dc"/><text x="816" y="207" class="label">模型承担的认知外包</text><text x="816" y="245" class="body">完整语言展开、形式推理</text><text x="816" y="277" class="body">检索整理、实现、接续与核验</text><path d="M230 302V333" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 302V333" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/><path d="M970 302V333" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="344" width="1092" height="112" rx="16" fill="#f5e7dc" stroke="#d7b8a4"/><text x="80" y="391" class="focus">本人提供开口，模型承担展开与实现，再由本人判断和纠正</text><text x="80" y="431" class="sub">从感受、草图、口述或短解释进入，让必要练习接上可用的结果。</text><text x="600" y="483" class="label" text-anchor="middle">整个环境的设计原则</text><rect x="80" y="498" width="326" height="58" rx="10" fill="#ffffff"/><text x="243" y="535" class="rule" text-anchor="middle">图优于文字</text><rect x="430" y="498" width="326" height="58" rx="10" fill="#ffffff"/><text x="593" y="535" class="rule" text-anchor="middle">清晰优于复杂</text><rect x="780" y="498" width="326" height="58" rx="10" fill="#ffffff"/><text x="943" y="535" class="rule" text-anchor="middle">直观优于形式</text><path d="M600 578V605" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="617" width="1132" height="113" rx="16" fill="#e1ece8" stroke="#bad0c6"/><text x="600" y="661" class="result" text-anchor="middle">成果可用 · 总负担可接受 · 选定能力得到锻炼</text><text x="600" y="702" class="sub" text-anchor="middle">分别检查三项结果，把交代、核验和恢复的成本一起算入。</text><text x="600" y="784" class="return" text-anchor="middle">实际使用返回，改进分工与选择分工的方法</text></svg>