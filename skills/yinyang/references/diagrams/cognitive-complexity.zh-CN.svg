<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 760">
<title id="title">少读冗余，更快看懂</title><desc id="desc">模型输出中的冗余文字和无关细节制造额外的阅读、筛选和记忆。以图大于文字、清晰大于复杂、直观大于形式组织呈现，让人看见结果与重要选择，模型维护背后的实现与证据，再从实际使用改进下一次呈现的方法。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.title{font-size:38px;font-weight:600;fill:#223c3b}.subtitle{font-size:20px;fill:#657572}.eyebrow{font-size:16px;font-weight:700;letter-spacing:2px;fill:#9b5336}.heading{font-size:27px;font-weight:600;fill:#263f3d}.body{font-size:20px;fill:#405653}.cardtitle{font-size:18px;font-weight:700;letter-spacing:1px;fill:#9b5336}.cardbody{font-size:21px;fill:#263f3d}.small{font-size:18px;fill:#657572}.return{font-size:20px;font-weight:600;fill:#a15035}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a15035" stroke-width="1.6"/></marker></defs>
<rect width="1100" height="760" rx="8" fill="#faf9f4"/><path d="M44 48H1056" stroke="#c8d2c8"/>
<text x="44" y="99" class="title">少读冗余，更快看懂</text><text x="45" y="132" class="subtitle">模型承担工作，也负责选择什么呈现给人</text><rect x="44" y="166" width="1012" height="115" rx="16" fill="#f5e9de"/><circle cx="81" cy="223" r="17" fill="#ac5c3e"/><path d="M81 214v11m0 6v1" stroke="#fffaf4" stroke-width="2.5" stroke-linecap="round"/><text x="113" y="214" class="heading">模型输出也在制造认知复杂性</text><text x="113" y="249" class="body">冗余文字与无关细节，让人额外阅读、筛选和记忆。</text><path d="M550 281V313" fill="none" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/><text x="44" y="342" class="eyebrow">重新设计用户看到的内容</text><rect x="44" y="359" width="324" height="112" rx="14" fill="#e9f0eb" stroke="#c7d8ce"/><text x="67" y="394" class="cardtitle">图大于文字</text><text x="67" y="435" class="cardbody">把关系放在同一眼前</text><rect x="388" y="359" width="324" height="112" rx="14" fill="#e9f0eb" stroke="#c7d8ce"/><text x="411" y="394" class="cardtitle">清晰大于复杂</text><text x="411" y="435" class="cardbody">留下当前判断需要的内容</text><rect x="732" y="359" width="324" height="112" rx="14" fill="#e9f0eb" stroke="#c7d8ce"/><text x="755" y="394" class="cardtitle">直观大于形式</text><text x="755" y="435" class="cardbody">直接呈现可理解的结果</text><path d="M550 471V502" fill="none" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="512" width="1012" height="112" rx="16" fill="#e1ece8" stroke="#bad0c6"/><text x="73" y="556" class="heading">人能够看懂，并继续自己的活动</text><text x="73" y="592" class="body">结果与重要选择直接可见；需要细节时，再从原处展开。</text><path d="M950 624V664Q950 684 930 684H45Q25 684 25 664V350" fill="none" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="275" y="664" width="550" height="39" rx="9" fill="#faf9f4"/><text text-anchor="middle" x="550" y="690" class="return">用实际使用，改进下一次呈现的方法</text><text text-anchor="middle" x="550" y="738" class="small">模型维护背后的实现、完整材料与核验。</text></svg>