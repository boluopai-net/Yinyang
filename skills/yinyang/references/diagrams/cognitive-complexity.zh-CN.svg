<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 820">
<title id="title">让整个环境更容易理解与使用</title><desc id="desc">总目标是减少用户环境的认知复杂性。信息与界面、操作与接续、模型辅助共同形成相连的要求。模型辅助是其中模型能直接改进的重要部分。图大于文字、清晰大于复杂、直观大于形式指导改变，再从整项活动的使用结果改进设计环境的方法。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.title{font-size:36px;font-weight:600;fill:#223c3b}.sub{font-size:22px;fill:#576d67}.label{font-size:20px;font-weight:600;fill:#355a50}.body{font-size:23px;fill:#405653}.focus{font-size:27px;font-weight:600;fill:#804327}.rule{font-size:20px;font-weight:700;fill:#804327}.result{font-size:28px;font-weight:600;fill:#223c3b}.return{font-size:23px;font-weight:600;fill:#804327}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a15035" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="820" rx="10" fill="#faf9f4"/>
<rect x="34" y="148" width="1132" height="430" rx="20" fill="#f0f3ef" stroke="#c7d5cc"/>
<text x="52" y="73" class="title">让整个环境更容易理解与使用</text><text x="54" y="114" class="sub">减少人需要寻找、记忆、解释和管理的内容</text><rect x="54" y="170" width="352" height="132" rx="14" fill="#ffffff"/><text x="76" y="207" class="label">信息与界面</text><text x="76" y="245" class="body">材料分散</text><text x="76" y="277" class="body">关系难以看清</text><rect x="424" y="170" width="352" height="132" rx="14" fill="#ffffff"/><text x="446" y="207" class="label">操作与接续</text><text x="446" y="245" class="body">步骤繁多</text><text x="446" y="277" class="body">反复恢复上下文</text><rect x="794" y="170" width="352" height="132" rx="14" fill="#f5e7dc"/><text x="816" y="207" class="label">模型辅助</text><text x="816" y="245" class="body">冗余解释</text><text x="816" y="277" class="body">额外选择与协调</text><path d="M970 302V333" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="344" width="1092" height="112" rx="16" fill="#f5e7dc" stroke="#d7b8a4"/><text x="80" y="391" class="focus">模型辅助：模型能直接改进的重要部分</text><text x="80" y="431" class="sub">筛选信息、评估选项、承担实现、保住上下文，让帮助本身更简单。</text><text x="600" y="483" class="label" text-anchor="middle">整个环境的设计原则</text><rect x="80" y="498" width="326" height="58" rx="10" fill="#ffffff"/><text x="243" y="535" class="rule" text-anchor="middle">图大于文字</text><rect x="430" y="498" width="326" height="58" rx="10" fill="#ffffff"/><text x="593" y="535" class="rule" text-anchor="middle">清晰大于复杂</text><rect x="780" y="498" width="326" height="58" rx="10" fill="#ffffff"/><text x="943" y="535" class="rule" text-anchor="middle">直观大于形式</text><path d="M600 578V605" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="617" width="1132" height="113" rx="16" fill="#e1ece8" stroke="#bad0c6"/><text x="600" y="661" class="result" text-anchor="middle">整项活动更容易看懂、开展和接续</text><text x="600" y="702" class="sub" text-anchor="middle">结果与重要选择清楚可见，所需细节在用到时展开。</text><text x="600" y="784" class="return" text-anchor="middle">从实际使用返回，改进设计环境的方法</text></svg>