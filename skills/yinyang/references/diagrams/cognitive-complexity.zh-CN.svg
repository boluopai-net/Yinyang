<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 760">
<title id="title">为阅读留出空间</title><desc id="desc">打开证据打断阅读思路。人与模型重新分配工作：培养辨认意义变化的能力，在阅读处调取原始材料，将材料对齐和版本管理交给模型。下一次任务检验注意力与纠正能力；实际结果可以再次改变分工，也可以淘汰方法。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.title{font-size:38px;font-weight:600;fill:#223c3b}.subtitle{font-size:20px;fill:#657572}.eyebrow{font-size:16px;font-weight:700;letter-spacing:2px;fill:#9b5336}.heading{font-size:27px;font-weight:600;fill:#263f3d}.body{font-size:20px;fill:#405653}.cardtitle{font-size:18px;font-weight:700;letter-spacing:1px;fill:#9b5336}.cardbody{font-size:21px;fill:#263f3d}.small{font-size:18px;fill:#657572}.return{font-size:20px;font-weight:600;fill:#a15035}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a15035" stroke-width="1.6"/></marker></defs>
<rect width="1100" height="760" rx="8" fill="#faf9f4"/><path d="M44 48H1056" stroke="#c8d2c8"/>
<text x="44" y="99" class="title">为阅读留出空间</text><text x="45" y="132" class="subtitle">让方法的改变进入下一次实际任务</text><rect x="44" y="166" width="1012" height="115" rx="16" fill="#f5e9de"/><circle cx="81" cy="223" r="17" fill="#ac5c3e"/><path d="M81 214v11m0 6v1" stroke="#fffaf4" stroke-width="2.5" stroke-linecap="round"/><text x="113" y="214" class="heading">阅读的联系断开了</text><text x="113" y="249" class="body">打开证据时，正在追随的思路被打断。</text><path d="M550 281V313" fill="none" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/><text x="44" y="342" class="eyebrow">重新分配工作</text><rect x="44" y="359" width="324" height="112" rx="14" fill="#e9f0eb" stroke="#c7d8ce"/><text x="67" y="394" class="cardtitle">培养</text><text x="67" y="435" class="cardbody">辨认意义何时发生变化</text><rect x="388" y="359" width="324" height="112" rx="14" fill="#e9f0eb" stroke="#c7d8ce"/><text x="411" y="394" class="cardtitle">调取</text><text x="411" y="435" class="cardbody">在阅读处呈现原始材料</text><rect x="732" y="359" width="324" height="112" rx="14" fill="#e9f0eb" stroke="#c7d8ce"/><text x="755" y="394" class="cardtitle">委托</text><text x="755" y="435" class="cardbody">对齐材料并管理版本</text><path d="M550 471V502" fill="none" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="512" width="1012" height="112" rx="16" fill="#e1ece8" stroke="#bad0c6"/><text x="73" y="556" class="heading">在下一次任务中试用新方法</text><text x="73" y="592" class="body">注意力能否延续？读者是否仍能纠正它？</text><path d="M950 624V664Q950 684 930 684H45Q25 684 25 664V350" fill="none" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="275" y="664" width="550" height="39" rx="9" fill="#faf9f4"/><text text-anchor="middle" x="550" y="690" class="return">根据实际发生的情况，再次改变分工</text><text text-anchor="middle" x="550" y="738" class="small">方法也可以被淘汰。</text></svg>