<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 760">
<title id="title">Less to read. More to grasp.</title><desc id="desc">Model output can impose reading, sorting and recall. Prefer visuals to text, clarity to complexity and intuition to formalism. Show results and meaningful choices while the model maintains supporting work and evidence. Actual use improves later output and interfaces.</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.title{font-size:38px;font-weight:600;fill:#223c3b}.subtitle{font-size:20px;fill:#657572}.eyebrow{font-size:16px;font-weight:700;letter-spacing:2px;fill:#9b5336}.heading{font-size:27px;font-weight:600;fill:#263f3d}.body{font-size:20px;fill:#405653}.cardtitle{font-size:18px;font-weight:700;letter-spacing:1px;fill:#9b5336}.cardbody{font-size:21px;fill:#263f3d}.small{font-size:18px;fill:#657572}.return{font-size:20px;font-weight:600;fill:#a15035}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a15035" stroke-width="1.6"/></marker></defs>
<rect width="1100" height="760" rx="8" fill="#faf9f4"/><path d="M44 48H1056" stroke="#c8d2c8"/>
<text x="44" y="99" class="title">Less to read. More to grasp.</text><text x="45" y="132" class="subtitle">The model carries the work and shapes what reaches the person</text><rect x="44" y="166" width="1012" height="115" rx="16" fill="#f5e9de"/><circle cx="81" cy="223" r="17" fill="#ac5c3e"/><path d="M81 214v11m0 6v1" stroke="#fffaf4" stroke-width="2.5" stroke-linecap="round"/><text x="113" y="214" class="heading">Output can create work for the reader</text><text x="113" y="249" class="body">Redundant prose and irrelevant details add reading, sorting and recall.</text><path d="M550 281V313" fill="none" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/><text x="44" y="342" class="eyebrow">DESIGN WHAT THE PERSON SEES</text><rect x="44" y="359" width="324" height="112" rx="14" fill="#e9f0eb" stroke="#c7d8ce"/><text x="67" y="394" class="cardtitle">VISUALS &gt; TEXT</text><text x="67" y="424" class="cardbody">Show the relationship</text><text x="67" y="450" class="cardbody">in one view</text><rect x="388" y="359" width="324" height="112" rx="14" fill="#e9f0eb" stroke="#c7d8ce"/><text x="411" y="394" class="cardtitle">CLARITY &gt; COMPLEXITY</text><text x="411" y="424" class="cardbody">Keep what serves</text><text x="411" y="450" class="cardbody">the current judgment</text><rect x="732" y="359" width="324" height="112" rx="14" fill="#e9f0eb" stroke="#c7d8ce"/><text x="755" y="394" class="cardtitle">INTUITION &gt; FORMALISM</text><text x="755" y="424" class="cardbody">Show a concrete result</text><text x="755" y="450" class="cardbody">the person can inspect</text><path d="M550 471V502" fill="none" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="512" width="1012" height="112" rx="16" fill="#e1ece8" stroke="#bad0c6"/><text x="73" y="556" class="heading">The person understands and continues</text><text x="73" y="592" class="body">Results and meaningful choices are visible; detail is available when needed.</text><path d="M950 624V664Q950 684 930 684H45Q25 684 25 664V350" fill="none" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="275" y="664" width="550" height="39" rx="9" fill="#faf9f4"/><text text-anchor="middle" x="550" y="690" class="return">Use the next task to improve how we present</text><text text-anchor="middle" x="550" y="738" class="small">The model maintains the supporting work and full evidence.</text></svg>