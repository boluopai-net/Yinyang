<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 820">
<title id="title">Make the whole environment easier to use</title><desc id="desc">The overall goal is to reduce cognitive complexity in the person&#x27;s environment. Information and interfaces, operations and continuity, and model assistance impose connected requirements. Model assistance is a major directly improvable part. Visuals, clarity and intuition guide changes, whose results are judged across the whole activity and feed back into environment design.</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.title{font-size:36px;font-weight:600;fill:#223c3b}.sub{font-size:22px;fill:#576d67}.label{font-size:20px;font-weight:600;fill:#355a50}.body{font-size:23px;fill:#405653}.focus{font-size:27px;font-weight:600;fill:#804327}.rule{font-size:20px;font-weight:700;fill:#804327}.result{font-size:28px;font-weight:600;fill:#223c3b}.return{font-size:23px;font-weight:600;fill:#804327}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a15035" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="820" rx="10" fill="#faf9f4"/>
<rect x="34" y="148" width="1132" height="430" rx="20" fill="#f0f3ef" stroke="#c7d5cc"/>
<text x="52" y="73" class="title">Make the whole environment easier to use</text><text x="54" y="114" class="sub">Reduce what a person must find, remember, interpret and manage</text><rect x="54" y="170" width="352" height="132" rx="14" fill="#ffffff"/><text x="76" y="207" class="label">INFORMATION &amp; INTERFACES</text><text x="76" y="245" class="body">Scattered material</text><text x="76" y="277" class="body">Unclear relationships</text><rect x="424" y="170" width="352" height="132" rx="14" fill="#ffffff"/><text x="446" y="207" class="label">OPERATIONS &amp; CONTINUITY</text><text x="446" y="245" class="body">Too many steps</text><text x="446" y="277" class="body">Repeated context recovery</text><rect x="794" y="170" width="352" height="132" rx="14" fill="#f5e7dc"/><text x="816" y="207" class="label">MODEL ASSISTANCE</text><text x="816" y="245" class="body">Redundant explanations</text><text x="816" y="277" class="body">Choices and coordination</text><path d="M970 302V333" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="344" width="1092" height="112" rx="16" fill="#f5e7dc" stroke="#d7b8a4"/><text x="80" y="391" class="focus">Model assistance: a major part the model can improve</text><text x="80" y="431" class="sub">Filter information, assess options, carry out the work and preserve context.</text><text x="600" y="483" class="label" text-anchor="middle">Principles for the whole environment</text><rect x="80" y="498" width="326" height="58" rx="10" fill="#ffffff"/><text x="243" y="535" class="rule" text-anchor="middle">VISUALS &gt; TEXT</text><rect x="430" y="498" width="326" height="58" rx="10" fill="#ffffff"/><text x="593" y="535" class="rule" text-anchor="middle">CLARITY &gt; COMPLEXITY</text><rect x="780" y="498" width="326" height="58" rx="10" fill="#ffffff"/><text x="943" y="535" class="rule" text-anchor="middle">INTUITION &gt; FORMALISM</text><path d="M600 578V605" stroke="#a15035" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="617" width="1132" height="113" rx="16" fill="#e1ece8" stroke="#bad0c6"/><text x="600" y="661" class="result" text-anchor="middle">The whole activity becomes easier to understand and continue</text><text x="600" y="702" class="sub" text-anchor="middle">Results and meaningful choices are clear; further detail is available when needed.</text><text x="600" y="784" class="return" text-anchor="middle">Use experience to improve how the environment is designed</text></svg>